groups:
  - name: tg-bot-alerts
    rules:
      # High error rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors per second for the last 5 minutes"

      # High response time
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value }} seconds"

      # Service down
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service is down"
          description: "{{ $labels.job }} service is down"

      # High memory usage
      - alert: HighMemoryUsage
        expr: (container_memory_usage_bytes / container_spec_memory_limit_bytes) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value | humanizePercentage }} for {{ $labels.container_name }}"

      # High CPU usage
      - alert: HighCPUUsage
        expr: rate(container_cpu_usage_seconds_total[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value | humanizePercentage }} for {{ $labels.container_name }}"

      # Database connection issues
      - alert: DatabaseConnectionIssues
        expr: rate(database_connection_errors_total[5m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Database connection issues"
          description: "Database connection errors detected: {{ $value }} errors per second"

      # Redis connection issues
      - alert: RedisConnectionIssues
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis connection issues"
          description: "Redis is not responding"

      # High queue size
      - alert: HighQueueSize
        expr: celery_queue_length > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High queue size"
          description: "Queue {{ $labels.queue }} has {{ $value }} pending tasks"

      # Failed tasks
      - alert: HighTaskFailureRate
        expr: rate(celery_task_failed_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High task failure rate"
          description: "Task failure rate is {{ $value }} failures per second"

      # Disk space low
      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space"
          description: "Disk space is {{ $value | humanizePercentage }} available on {{ $labels.mountpoint }}"

      # SSL certificate expiry
      - alert: SSLCertificateExpiry
        expr: ssl_cert_not_after - time() < 7 * 24 * 3600
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "SSL certificate expiring soon"
          description: "SSL certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}"

  - name: tg-bot-business-alerts
    rules:
      # High meeting creation rate
      - alert: HighMeetingCreationRate
        expr: rate(meetings_created_total[5m]) > 10
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "High meeting creation rate"
          description: "Meeting creation rate is {{ $value }} meetings per second"

      # OAuth token expiry issues
      - alert: OAuthTokenExpiryIssues
        expr: rate(oauth_tokens_expired_total[1h]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High OAuth token expiry rate"
          description: "OAuth token expiry rate is {{ $value }} per second"

      # Notification delivery issues
      - alert: NotificationDeliveryIssues
        expr: rate(notifications_failed_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High notification failure rate"
          description: "Notification failure rate is {{ $value }} failures per second"

      # API rate limit exceeded
      - alert: APIRateLimitExceeded
        expr: rate(http_requests_total{status="429"}[5m]) > 0.01
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "API rate limit exceeded"
          description: "Rate limit exceeded for {{ $labels.endpoint }}: {{ $value }} requests per second"
